plugins {
    id 'com.android.application'
}

android {
    namespace 'com.imperium.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imperium.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
